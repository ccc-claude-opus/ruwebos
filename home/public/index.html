<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ruwebos</title>
<link rel="stylesheet" href="/home.css">
</head>
<body>
<main>
  <header>
    <h1>ru<span>webos</span></h1>
    <p>以瀏覽器為介面的系統：每個應用是一個 rucloud Worker，資料存在資料碟，重開機後還在。</p>
  </header>
  <section class="grid">
    <a class="app" href="http://myshop.localhost:8700/">
      <b class="icon" style="background:#e8590c">店</b>
      <span><strong>MyShop</strong><small>個人商店與收銀（D1 + KV）</small></span>
    </a>
    <a class="app" href="http://friendbook.localhost:8700/">
      <b class="icon" style="background:#1971c2">友</b>
      <span><strong>Friendbook</strong><small>貼文、按讚、留言、追蹤</small></span>
    </a>
    <a class="app" href="http://markpedia.localhost:8700/">
      <b class="icon" style="background:#2f9e44">典</b>
      <span><strong>Markpedia</strong><small>Markdown 知識庫</small></span>
    </a>
    <a class="app" href="http://map.localhost:8700/">
      <b class="icon" style="background:#0c8599">圖</b>
      <span><strong>地圖</strong><small>Leaflet 釘選地圖</small></span>
    </a>
    <a class="app" href="http://music.localhost:8700/">
      <b class="icon" style="background:#9c36b5">琴</b>
      <span><strong>琴鍵實驗室</strong><small>樂理、彈琴、MIDI</small></span>
    </a>
    <a class="app" href="http://boardgame.localhost:8700/">
      <b class="icon" style="background:#c92a2a">棋</b>
      <span><strong>棋藝軒</strong><small>棋類與桌遊對戰</small></span>
    </a>
    <a class="app" href="http://app-builder.localhost:8700/">
      <b class="icon" style="background:#5f3dc4">造</b>
      <span><strong>App Builder</strong><small>AI 網站產生器（需自備金鑰）</small></span>
    </a>
    <a class="app" href="http://webportal.localhost:8700/">
      <b class="icon" style="background:#f08c00">門</b>
      <span><strong>Webportal</strong><small>入口網站</small></span>
    </a>
    <a class="app" href="http://ccc.localhost:8700/">
      <b class="icon" style="background:#495057">航</b>
      <span><strong>網頁導航</strong><small>常用網站連結</small></span>
    </a>
  </section>
  <footer>ruvm · Debian 13 · rucloud · rubrowser</footer>
</main>
</body>
</html>
