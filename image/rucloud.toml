# ruwebos 的 rucloud 設定範本：系統碟的 /opt/ruwebos/rucloud.toml。/sbin/init 開機時把 @ADMIN_TOKEN@ 換成
# 資料碟上的 token，寫到 /run/ruwebos/rucloud.toml 再以 rucloud serve 執行（所以路徑都用絕對路徑）。
# 應用在系統碟（唯讀，用 snapshot 掛載），資料在資料碟 /data（D1、KV、R2、Durable Objects）。
# 主畫面 home/public/index.html 由 image/gen-home.mjs 依這裡的應用產生。
state_dir = "/data/rucloud"
bind = "0.0.0.0"
shutdown_timeout = 2

# 所有應用共用的入口，依 Host 分派：http://<應用名稱>.localhost:8700
# 主機端由 ruvm 的 hostfwd 轉到 127.0.0.1:8700
[edge]
port = 8700

# 管理介面只聽 VM 裡的本機；「設定」應用用它列出應用
[admin]
port = 8799
token = "@ADMIN_TOKEN@"

# app-builder 產生的網站在執行中新增成獨立的應用（http://gen-<專案id>.localhost:8700）
[dynamic]
grant = ["app-builder"]

# 主畫面：http://localhost:8700、http://127.0.0.1:8700
[[app]]
path = "/opt/ruwebos/home"
hosts = ["localhost", "127.0.0.1"]

# ---- ruwebos 的基本應用（本 repo 的 apps/；共用 apps/_shared）
[[app]]
path = "/opt/ruwebos/apps/files"
allow_read = ["/opt/ruwebos/apps/_shared"]

[[app]]
path = "/opt/ruwebos/apps/contacts"
d1_init = { DB = "schema.sql" }
allow_read = ["/opt/ruwebos/apps/_shared"]

[[app]]
