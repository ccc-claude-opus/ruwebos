# 在主機上直接跑 ruwebos 的應用（開發用，不經 VM）：
#   rucloud serve $PWD/apps/dev.toml      （設定檔要用絕對路徑，allow_read 才會對）
#   node apps/test.mjs http://localhost:8790
# 主畫面 http://localhost:8790/，應用 http://<名稱>.localhost:8790/；資料在 out/dev-state。
# 預裝套件（rucloud 的範例）要先產生：node image/gen-packages.mjs ../rucloud；主畫面的系統應用：node image/gen-home.mjs ../rucloud
state_dir = "../out/dev-state"
shutdown_timeout = 1

[edge]
port = 8790

# 安裝程式要用管理埠（[install]）；token 不設就自動產生在 out/dev-state/admin-token
[admin]
port = 8791

[install]
grant = ["installer"]
services = ["files", "settings"]

[[app]]
path = "../home"
hosts = ["localhost", "127.0.0.1"]

[[app]]
path = "files"
allow_read = ["_shared"]

[[app]]
path = "contacts"
d1_init = { DB = "schema.sql" }
allow_read = ["_shared"]

[[app]]
path = "calendar"
d1_init = { DB = "schema.sql" }
allow_read = ["_shared"]

[[app]]
path = "notes"
d1_init = { DB = "schema.sql" }
allow_read = ["_shared"]

[[app]]
path = "todo"
d1_init = { DB = "schema.sql" }
allow_read = ["_shared"]

[[app]]
path = "calculator"
allow_read = ["_shared"]

[[app]]
path = "clock"
allow_read = ["_shared"]

[[app]]
path = "map"
d1_init = { DB = "schema.sql" }

[[app]]
path = "settings"
allow_read = ["_shared"]

[[app]]
path = "photos"
d1_init = { DB = "schema.sql" }
allow_read = ["_shared"]

[[app]]
path = "songs"
d1_init = { DB = "schema.sql" }
allow_read = ["_shared"]

[[app]]
path = "videos"
d1_migrate = true
allow_read = ["_shared"]

[[app]]
path = "weather"
allow_read = ["_shared"]

[[app]]
path = "installer"
d1_init = { DB = "schema.sql" }
allow_read = ["_shared"]
